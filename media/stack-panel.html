<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Backtrace Stack</title>
<style>
/* VSCode 自定义 CSS 属性（var(--vscode-...)）：
   这些变量由 VSCode 动态注入到 webview 中，值随当前主题变化。
   使用这些变量可以保证我们的 webview 颜色和 VSCode 主题一致。 */

body {
  font-family: var(--vscode-font-family);
  font-size: 13px;
  padding: 4px 0;
  margin: 0;
}

/* 每条导航记录的行 */
.stack-row {
  display: flex;         /* 弹性布局：子元素横向排列 */
  align-items: center;   /* 垂直居中 */
  gap: 5px;              /* 子元素间距 */
  padding: 3px 0;        /* 上下 3px，左右 0（× 按钮紧贴左侧） */
  cursor: pointer;       /* 鼠标变为手型，提示可点击 */
  border-radius: 2px;
}

.stack-row:hover {
  background: var(--vscode-list-hoverBackground); /* 悬停高亮 */
}

.stack-row.current {
  background: var(--vscode-list-activeSelectionBackground);
  color: var(--vscode-list-activeSelectionForeground);
}

/* 文件颜色小圆点 */
.file-color {
  width: 8px;
  height: 8px;
  border-radius: 50%;  /* 圆形 */
  flex-shrink: 0;      /* 不被压缩 */
}

/* 文件名:行号（配色方案颜色） */
.file-loc {
  color: var(--vscode-textPreformat-foreground);
  white-space: nowrap;  /* 不换行 */
}

/* 函数路径 */
.func-path {
  font-weight: 500;      /* 中等粗细 */
  white-space: nowrap;
}

.spacer {
  flex: 1; /* 占据所有剩余空间，把 ← 推到右边 */
}

.badge {
  font-weight: bold;
  font-size: 12px;
}

/* × 删除按钮：默认隐藏，hover 时显示 */
.delete-btn {
  visibility: hidden;
  cursor: pointer;
  font-size: 12px;
  opacity: 0.6;
  flex-shrink: 0;  /* 不被压缩 */
  min-width: 14px; /* 保证可点击区域 */
  text-align: center;
}
.delete-btn:hover {
  opacity: 1;
}
.stack-row:hover .delete-btn {
  visibility: visible;
}

/* 缩进占位：根据 depth 层级产生树状缩进效果 */
.indent {
  flex-shrink: 0;
}

/* 空树提示 */
.empty {
  color: var(--vscode-disabledForeground);
  padding: 16px;
  text-align: center;
}
</style>
</head>
<body>
${treeHtml}
<script>
(function() {
  "use strict";

  // acquireVsCodeApi()：获取 VSCode 提供的 API 对象。
  // 这个函数由 VSCode 注入到 webview 的全局作用域中。
  // API 对象有三个方法：postMessage()、getState()、setState()。
  const vscode = acquireVsCodeApi();

  // 遍历所有 .stack-row 元素，绑定事件
  document.querySelectorAll('.stack-row').forEach(row => {
    // dataset.idx：读取 HTML 的 data-idx 属性。
    // HTML：data-idx='[0,1]'
    // JS：row.dataset.idx → "[0,1]"
    // JSON.parse → [0, 1]
    const idx = JSON.parse(row.dataset.idx);

    // 点击整行 → 跳转（除非点的是 × 按钮）
    row.addEventListener('click', (e) => {
      // classList.contains：判断点击目标是否包含某个 CSS 类名
      if (e.target.classList.contains('delete-btn')) return;
      // postMessage：发送消息给扩展（TypeScript 端）
      vscode.postMessage({ command: 'jumpTo', indices: idx });
    });

    // × 删除按钮的独立点击事件
    const delBtn = row.querySelector('.delete-btn');
    if (delBtn) {
      delBtn.addEventListener('click', (e) => {
        e.stopPropagation();  // 阻止事件冒泡：避免触发上层的 row.click
        vscode.postMessage({ command: 'deleteNode', indices: idx });
      });
    }
  });
})();
</script>
</body>
</html>
